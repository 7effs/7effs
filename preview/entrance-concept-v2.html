<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>JAYE — Entrance Study 03</title>
<style>
:root{--black:#050505;--wall:#151515;--white:#f3f2ef;--ivory:#efeee9;--muted:#858585;--ease:cubic-bezier(.76,0,.24,1);--soft:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;width:100%;height:100svh;min-height:500px;overflow:hidden;background:var(--black);isolation:isolate}
#stage *{box-sizing:border-box}
.meta{position:absolute;z-index:30;top:max(22px,env(safe-area-inset-top));left:max(22px,env(safe-area-inset-left));right:max(22px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;color:#858585;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.meta strong{color:#d2d1cd;font-weight:500}
.skip{position:absolute;z-index:40;top:max(14px,env(safe-area-inset-top));right:22px;border:0;background:none;color:#b8b8b8;font:9px Arial;letter-spacing:.15em;cursor:pointer;padding:12px 0 12px 12px}
.skip:hover{color:white}
.counter{position:absolute;z-index:30;right:22px;bottom:24px;color:#777;font-size:9px;letter-spacing:.15em}
.scene{position:absolute;inset:0;overflow:hidden}
.intro{background:var(--black)}
/* The wall is assembled from offset planes, not a stock light-beam effect. */
.wall{position:absolute;left:0;top:0;bottom:0;width:clamp(120px,29vw,430px);background:var(--wall);transform:scaleX(0);transform-origin:left;animation:wallBuild 1.15s var(--ease) .08s both}
.wall-cap{position:absolute;left:0;top:0;width:clamp(120px,29vw,430px);height:1px;background:rgba(243,242,239,.32);transform:scaleX(0);transform-origin:left;animation:lineX .7s var(--soft) .62s both}
.wall-inner{position:absolute;left:clamp(16px,4vw,54px);top:11%;bottom:11%;width:1px;background:rgba(243,242,239,.1);transform:scaleY(0);transform-origin:top;animation:lineY .8s var(--soft) .7s both}
.wall-return{position:absolute;left:clamp(120px,29vw,430px);top:0;bottom:0;width:1px;background:rgba(243,242,239,.45);transform:scaleY(0);transform-origin:top;animation:lineY .72s var(--soft) .72s both}
.wall-foot{position:absolute;left:0;top:calc(50% + clamp(115px,17vw,220px));height:clamp(3px,.45vw,6px);width:clamp(210px,43vw,620px);background:var(--white);transform:scaleX(0);transform-origin:left;animation:lineX .9s var(--ease) 1.12s both}
.wall-foot::after{content:"";position:absolute;right:0;top:0;bottom:0;width:24%;background:#a6a49e;transform:scaleX(0);transform-origin:right;animation:lineX .45s var(--soft) 1.65s both}
.hi{position:absolute;left:clamp(120px,29vw,430px);top:50%;transform:translateY(-57%);display:flex;align-items:baseline;gap:.025em;color:var(--white);font-size:clamp(150px,29vw,390px);font-weight:750;letter-spacing:-.105em;line-height:.76;white-space:nowrap}
.hi .h{display:block;opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-.16em);animation:hBuild 1.05s var(--soft) .58s both}
.hi .i{display:block;opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(.18em);animation:iBuild .9s var(--soft) .88s both}
.presence{position:absolute;left:clamp(120px,29vw,430px);top:calc(50% + clamp(150px,20vw,250px));font-size:8px;letter-spacing:.24em;color:#929292;opacity:0;transform:translateY(7px);animation:caption .5s ease 1.75s both}
.scene.intro{animation:introCollapse .72s var(--ease) 2.5s both;transform-origin:center}
.scene.intro .wall,.scene.intro .wall-cap,.scene.intro .wall-inner,.scene.intro .wall-return,.scene.intro .wall-foot,.scene.intro .hi,.scene.intro .presence{animation-fill-mode:both}
/* The plinth turns into the full-width archive strip. */
.strip{position:absolute;z-index:5;left:0;right:0;top:43%;height:14%;background:var(--ivory);color:#080808;clip-path:inset(0 100% 0 0);animation:stripOpen .9s var(--ease) 2.78s both}
.strip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:#080808;opacity:.3}
.strip-text{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;font-size:clamp(11px,1.85vw,23px);font-weight:700;letter-spacing:.22em;white-space:nowrap;clip-path:inset(0 100% 0 0);animation:textReveal .62s var(--soft) 3.08s both}
.strip-end{position:absolute;right:0;top:0;bottom:0;width:1px;background:#080808;transform:scaleY(0);transform-origin:center;animation:lineY .45s var(--soft) 3.42s both}
.strip{animation-name:stripOpen,stripClose;animation-duration:.9s,.55s;animation-timing-function:var(--ease),var(--ease);animation-delay:2.78s,3.72s;animation-fill-mode:both,both}
.strip-close-line{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--white);transform:scaleX(0);transform-origin:center;animation:lineX .5s var(--ease) 4.0s both}
/* Phrases are not two centered cards: the first enters from the wall, the second answers from the opposite edge. */
.phrase{position:absolute;z-index:4;left:7vw;right:7vw;top:50%;margin:0;transform:translateY(-50%);color:var(--white);font-size:clamp(34px,7.1vw,94px);font-weight:650;letter-spacing:-.075em;line-height:.94;text-transform:uppercase}
.phrase span{display:block;overflow:hidden}
.phrase b{display:block;font-weight:inherit;opacity:0;will-change:transform,clip-path,opacity}
.p1 span:first-child b{clip-path:inset(0 100% 0 0);transform:translateX(-5vw);animation:phraseLeft .72s var(--soft) 4.12s both}
.p1 span:last-child b{clip-path:inset(0 0 0 100%);transform:translateX(5vw);animation:phraseRight .72s var(--soft) 4.34s both}
.p1{animation:phraseOut .42s ease-in 5.28s both}
.p2 span:first-child b{clip-path:inset(0 0 0 100%);transform:translateX(5vw);animation:phraseRight .72s var(--soft) 5.48s both}
.p2 span:last-child b{clip-path:inset(0 100% 0 0);transform:translateX(-5vw);animation:phraseLeft .72s var(--soft) 5.7s both}
.p2{animation:phraseOut .42s ease-in 6.68s both}
.phrase-index{position:absolute;left:7vw;bottom:24%;color:#858585;font-size:8px;letter-spacing:.22em;opacity:0;animation:caption .5s ease 5.7s both}
/* The slash grows out of the original left seam, then carries the wipe. */
.slash{position:absolute;z-index:7;left:clamp(120px,29vw,430px);top:50%;width:clamp(3px,.45vw,6px);height:140vh;background:var(--white);transform:translate(-50%,-50%) rotate(0deg) scaleY(0);transform-origin:center;animation:slashBuild .68s var(--soft) 6.65s both,slashTravel .82s var(--ease) 7.22s both}
.wipe-ivory,.wipe-black{position:absolute;inset:0;transform:translateY(105%);pointer-events:none}
.wipe-ivory{z-index:8;background:var(--ivory);animation:wipe .62s var(--ease) 7.36s both}
.wipe-black{z-index:9;background:var(--black);animation:wipe .58s var(--ease) 8.04s both}
/* The final frame grows from four measured corners; the title opens as one unit from the seam. */
.final{position:absolute;z-index:10;inset:0;opacity:0;animation:finalOn .01s linear 8.58s both}
.frame{position:absolute;left:11vw;right:11vw;top:25%;height:47%;opacity:0;animation:frameArrive 1.25s var(--soft) 8.62s both}
.corner{position:absolute;width:clamp(30px,6vw,90px);height:clamp(30px,6vw,90px);opacity:0;animation:cornerDraw .72s var(--soft) both}.c1{animation-delay:8.82s}.c2{animation-delay:8.96s}.c3{animation-delay:9.10s}.c4{animation-delay:9.24s}
.corner::before,.corner::after{content:"";position:absolute;background:rgba(243,242,239,.42)}
.corner::before{height:1px;width:100%}.corner::after{width:1px;height:100%}
.c1{left:0;top:0}.c2{right:0;top:0;transform:scaleX(-1)}.c3{left:0;bottom:0;transform:scaleY(-1)}.c4{right:0;bottom:0;transform:scale(-1)}
.frame-line{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(243,242,239,.1);transform:scaleY(0);transform-origin:center;animation:lineY .8s var(--soft) 9.28s both}
.final-word{position:absolute;left:0;right:0;top:45%;display:flex;justify-content:center;align-items:baseline;gap:.015em;padding:.08em 3vw .16em;font-size:clamp(78px,21vw,255px);font-weight:750;letter-spacing:-.105em;line-height:.9;color:#f4f3ef;white-space:nowrap}
.final-word span{display:block;opacity:0;clip-path:inset(0 50%);transform:scaleX(.7)}
.final-word span:nth-child(1){animation:wordOpen .88s var(--soft) 8.82s both}
.final-word span:nth-child(2){animation:wordOpen .88s var(--soft) 8.95s both}
.final-word span:nth-child(3){animation:wordOpen .88s var(--soft) 9.08s both}
.final-word span:nth-child(4){animation:wordOpen .88s var(--soft) 9.21s both}
.final-small{position:absolute;top:calc(45% + clamp(88px,17vw,205px));left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.25em;color:#929292;white-space:nowrap;opacity:0;animation:caption .5s ease 9.85s both}
.final-rule{position:absolute;left:7vw;right:7vw;bottom:25%;height:1px;background:rgba(255,255,255,.35);transform:scaleX(0);transform-origin:center;animation:ruleIn .72s var(--soft) 9.78s both}
.final-tag{position:absolute;left:7vw;bottom:calc(25% - 25px);font-size:9px;letter-spacing:.19em;color:#999;opacity:0;clip-path:inset(0 100% 0 0);animation:tagIn .5s var(--soft) 10.08s both}
.sweep{position:absolute;z-index:4;left:30%;top:34%;width:8vw;max-width:110px;min-width:36px;height:38%;opacity:0;transform:translateX(-180%) skewX(-16deg);background:linear-gradient(90deg,transparent,rgba(243,242,239,.28),transparent);animation:titleSweep 1.2s var(--soft) 10.1s both}
.progress{position:absolute;z-index:35;left:0;right:0;bottom:0;height:1px;background:rgba(243,242,239,.1)}
.progress i{display:block;width:100%;height:100%;background:rgba(243,242,239,.7);transform:scaleX(0);transform-origin:left;animation:progress 11.8s linear both}
.controls{position:absolute;z-index:50;right:22px;bottom:22px}
.controls button{border:1px solid #4a4843;background:rgba(5,5,5,.85);color:#c7c5c0;padding:10px 13px;font:9px Arial;letter-spacing:.15em;cursor:pointer}
.controls button:hover{background:var(--ivory);color:#080808}\n#stage.skipped .scene,#stage.skipped .wipe-ivory,#stage.skipped .wipe-black,#stage.skipped .counter,#stage.skipped .progress{display:none!important}\n#stage.skipped .final{opacity:1!important;animation:none!important}\n#stage.skipped .frame{opacity:.72!important;animation:none!important}\n#stage.skipped .corner{opacity:1!important;animation:none!important;clip-path:none!important}\n#stage.skipped .frame-line{transform:scaleY(1)!important;animation:none!important}\n#stage.skipped .final-word span{opacity:1!important;clip-path:none!important;transform:none!important;animation:none!important}\n#stage.skipped .final-small,#stage.skipped .final-rule,#stage.skipped .final-tag{opacity:1!important;clip-path:none!important;transform:none!important;animation:none!important}
@keyframes wallBuild{to{transform:scaleX(1)}}
@keyframes lineX{to{transform:scaleX(1)}}
@keyframes lineY{to{transform:scaleY(1)}}
@keyframes hBuild{0%{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-.16em)}65%{opacity:1;clip-path:inset(0);transform:translateX(.015em)}100%{opacity:1;clip-path:inset(0);transform:translateX(0)}}
@keyframes iBuild{0%{opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(.18em)}68%{opacity:1;clip-path:inset(0);transform:translateY(-.02em)}100%{opacity:1;clip-path:inset(0);transform:translateY(0)}}
@keyframes caption{to{opacity:1;transform:translateY(0)}}
@keyframes introCollapse{to{opacity:0;visibility:hidden;transform:scaleY(.015)}}
@keyframes stripOpen{to{clip-path:inset(0)}}
@keyframes stripClose{to{clip-path:inset(49.5% 0)}}
@keyframes textReveal{to{clip-path:inset(0)}}
@keyframes phraseLeft{to{opacity:1;clip-path:inset(0);transform:translateX(0)}}
@keyframes phraseRight{to{opacity:1;clip-path:inset(0);transform:translateX(0)}}
@keyframes phraseOut{to{opacity:0;transform:translateY(-58%) scale(.99)}}
@keyframes slashBuild{to{transform:translate(-50%,-50%) rotate(28deg) scaleY(1)}}
@keyframes slashTravel{to{transform:translate(150vw,-50%) rotate(28deg) scaleY(.24)}}
@keyframes wipe{to{transform:translateY(-105%)}}
@keyframes finalOn{to{opacity:1}}\n@keyframes frameArrive{0%{opacity:0;transform:scale(.94)}65%{opacity:1;transform:scale(1.01)}100%{opacity:.72;transform:scale(1)}}\n@keyframes cornerDraw{0%{opacity:0;clip-path:inset(0 100% 100% 0)}100%{opacity:1;clip-path:inset(0)}}
@keyframes wordOpen{0%{opacity:0;clip-path:inset(0 50%);transform:scaleX(.7)}70%{opacity:1;clip-path:inset(0);transform:scaleX(1.025)}100%{opacity:1;clip-path:inset(0);transform:scaleX(1)}}
@keyframes ruleIn{to{transform:scaleX(1)}}
@keyframes tagIn{to{opacity:1;clip-path:inset(0)}}
@keyframes titleSweep{0%{opacity:0;transform:translateX(-180%) skewX(-16deg)}18%{opacity:.85}100%{opacity:0;transform:translateX(520%) skewX(-16deg)}}
@keyframes progress{to{transform:scaleX(1)}}
@media(max-width:600px){
 .meta{top:18px;left:18px;right:18px;font-size:7px}.skip{top:9px;right:18px;font-size:8px}
 .wall{width:29vw}.wall-return{left:29vw}.hi{left:29vw;font-size:clamp(145px,42vw,250px)}
 .wall-foot{width:47vw;top:calc(50% + 23vw)}.presence{left:29vw;top:calc(50% + 38vw);font-size:7px}
 .strip{top:43.5%;height:13%}.strip-text{font-size:clamp(9px,2.5vw,14px);letter-spacing:.14em}
 .phrase{left:6vw;right:6vw;font-size:clamp(29px,8vw,48px)}.phrase-index{left:6vw;bottom:28%;font-size:7px}
 .slash{left:29vw}
 .frame{left:6vw;right:6vw;top:27%;height:43%}
 .final-word{font-size:clamp(64px,20.5vw,86px)}
 .final-small{top:calc(45% + 75px);font-size:7px;letter-spacing:.18em}
 .final-rule{bottom:29%}.final-tag{left:6vw;bottom:calc(29% - 25px);font-size:7px;letter-spacing:.12em}
 .counter{right:18px;bottom:18px;font-size:7px}.controls{right:18px;bottom:48px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}
 .intro{display:none}.final{opacity:1}
}
</style>
</head>
<body>
<main id="stage" aria-label="JAYE entrance study 03">
  <div class="meta"><strong>J / EFFS — DIGITAL ARCHIVE</strong><span>STUDY 03 / 11.8 SEC</span></div>
  <button class="skip" id="skip" type="button">ENTER ARCHIVE ↗</button>
  <section class="scene intro" aria-hidden="true">
    <div class="wall"></div><div class="wall-cap"></div><div class="wall-inner"></div><div class="wall-return"></div><div class="wall-foot"></div>
    <div class="hi"><span class="h">H</span><span class="i">i</span></div>
    <div class="presence">A PRESENCE / 001</div>
  </section>
  <section class="scene" aria-hidden="true">
    <div class="strip"><div class="strip-text">MEMORY / ART&nbsp;&nbsp; — &nbsp;&nbsp;JAYE ARCHIVE</div><span class="strip-end"></span></div>
    <span class="strip-close-line"></span>
    <p class="phrase p1"><span><b>FRAGMENTS OF</b></span><span><b>BECOMING.</b></span></p>
    <p class="phrase p2"><span><b>WORDS THAT</b></span><span><b>REMAIN /</b></span></p>
    <span class="phrase-index">A RECORD OF WHAT STAYS</span>
    <span class="slash"></span>
  </section>
  <span class="wipe-ivory"></span><span class="wipe-black"></span>
  <section class="final" aria-hidden="true">
    <div class="frame">
      <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
      <span class="frame-line"></span>
    </div>
    <div class="final-word"><span>J</span><span>A</span><span>Y</span><span>E</span></div>
    <div class="final-small">THE LIVING ARCHIVE</div>
    <div class="final-rule"></div>
    <div class="final-tag">MEMORY / ART / EVERYTHING THAT REMAINS</div>
    <div class="sweep"></div>
  </section>
  <div class="counter">JAYE / 001 — ENTERING</div>
  <div class="progress"><i></i></div>
  <div class="controls"><button id="replay" type="button">REPLAY ↻</button></div>
</main>
<script>
const stage=document.getElementById('stage');
stage.querySelector('#replay').addEventListener('click',()=>location.reload());
stage.querySelector('#skip').addEventListener('click',()=>stage.classList.add('skipped'));
</script>
</body>
</html>

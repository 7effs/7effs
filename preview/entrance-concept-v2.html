<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>JAYE — Entrance Concept V2</title>
<style>
:root{color-scheme:dark;--ink:#090909;--ivory:#e9e5dc;--muted:#8b8881;--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--ivory);font-family:var(--sans)}
body{overflow:hidden}
.stage{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden;background:#090909;isolation:isolate}
.grain{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
.topline{position:absolute;z-index:30;top:30px;left:5vw;right:5vw;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.24em;color:#77736c;text-transform:uppercase}
.topline strong{font-weight:500;color:#c7c1b6}
.scene{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.scene-dark{background:radial-gradient(ellipse at 50% 55%,#1b1a18 0,#0c0c0b 42%,#070707 78%)}
.arch{position:absolute;width:min(48vw,570px);height:70vh;min-height:360px;top:50%;left:50%;transform:translate(-50%,-46%);border:1px solid #37332d;clip-path:inset(100% 0 0 0);animation:archRise 2.5s cubic-bezier(.7,0,.2,1) .25s both}
.arch:before{content:"";position:absolute;inset:0 12%;border-left:1px solid #34312b;border-right:1px solid #34312b}
.arch:after{content:"";position:absolute;left:50%;top:0;height:100%;width:1px;background:linear-gradient(transparent,#8d826c 48%,transparent);opacity:.6}
.lightcut{position:absolute;width:1px;height:120vh;left:50%;top:50%;background:linear-gradient(transparent,rgba(232,222,199,.9),transparent);transform:translate(-50%,-50%) rotate(18deg) scaleY(0);transform-origin:center;animation:cutOpen 1.1s cubic-bezier(.7,0,.2,1) 1.55s both;box-shadow:0 0 28px rgba(220,207,177,.22)}
.hello{position:relative;z-index:2;font-family:var(--serif);font-size:clamp(100px,22vw,280px);font-weight:400;letter-spacing:-.105em;line-height:.8;color:#e7e1d5;display:flex;align-items:baseline;opacity:0;animation:helloIn 1.2s cubic-bezier(.16,1,.3,1) 2.2s both}
.hello span:first-child{transform:translateY(34px);animation:letterUp .9s cubic-bezier(.16,1,.3,1) 2.35s both}
.hello span:last-child{font-style:italic;transform:translateY(-24px);animation:letterDown .9s cubic-bezier(.16,1,.3,1) 2.62s both}
.scene-note{position:absolute;bottom:10.5%;left:0;width:100%;text-align:center;font-size:9px;letter-spacing:.34em;color:#77736b;opacity:0;animation:fadeIn .7s ease 3.1s both}
.scene-flash{background:var(--ivory);color:#171613;clip-path:inset(0 0 100% 0);animation:ivoryReveal .75s cubic-bezier(.76,0,.18,1) 4.15s both}
.fragment{position:absolute;font-family:var(--serif);font-weight:400;letter-spacing:-.055em;line-height:.88;white-space:nowrap;overflow:hidden}
.fragment em{font-weight:400}
.fragment-a{top:22%;left:9%;font-size:clamp(40px,8.5vw,112px);clip-path:inset(0 100% 0 0);animation:maskText 1s cubic-bezier(.77,0,.18,1) 4.65s both}
.fragment-b{top:43%;right:8%;font-size:clamp(30px,6vw,76px);font-style:italic;clip-path:inset(0 0 0 100%);animation:maskTextRight .9s cubic-bezier(.77,0,.18,1) 5.45s both}
.fragment-c{bottom:19%;left:13%;font-size:clamp(16px,2.4vw,30px);font-family:var(--sans);font-weight:400;letter-spacing:.24em;text-transform:uppercase;clip-path:inset(0 100% 0 0);animation:maskText .8s cubic-bezier(.77,0,.18,1) 6.05s both}
.rule{position:absolute;height:1px;background:#b7b0a3;left:9%;right:9%;top:38%;transform:scaleX(0);transform-origin:left;animation:ruleGrow .9s ease 5.1s both}
.scene-cut{background:#050505;clip-path:inset(0 0 100% 0);animation:blackReveal .65s cubic-bezier(.76,0,.18,1) 7.05s both}
.cut-word{font-family:var(--serif);font-size:clamp(35px,7vw,88px);font-weight:400;letter-spacing:-.04em;color:#d9d3c8;opacity:0;transform:translateY(24px);animation:cutWord 1s cubic-bezier(.16,1,.3,1) 7.5s both}
.cut-word span{font-style:italic;color:#8f897e}
.final{background:#090909;clip-path:inset(0 0 100% 0);animation:finalReveal .7s cubic-bezier(.76,0,.18,1) 8.55s both}
.final:before,.final:after{content:"";position:absolute;left:8vw;right:8vw;height:1px;background:#38352f;transform:scaleX(0);animation:ruleGrow 1s ease 9.1s both}
.final:before{top:28%}.final:after{bottom:28%;animation-delay:9.35s}
.wordmark{position:relative;display:flex;align-items:center;justify-content:center;gap:.015em;font-family:var(--sans);font-size:clamp(58px,15vw,190px);font-weight:300;letter-spacing:.12em;padding-left:.12em;color:#eee9df}
.wordmark span{display:inline-block;opacity:0;transform:translateY(36px);animation:markLetter .75s cubic-bezier(.16,1,.3,1) both}
.wordmark span:nth-child(1){animation-delay:9.05s}.wordmark span:nth-child(2){animation-delay:9.2s}.wordmark span:nth-child(3){animation-delay:9.35s}.wordmark span:nth-child(4){animation-delay:9.5s}
.sweep{position:absolute;top:25%;bottom:25%;left:0;width:18%;background:linear-gradient(90deg,transparent,rgba(239,232,215,.22),transparent);transform:translateX(-150%) skewX(-18deg);animation:sweep 1.35s cubic-bezier(.2,.7,.2,1) 10.05s both}
.final-caption{position:absolute;bottom:19%;font-size:9px;letter-spacing:.38em;color:#89847b;opacity:0;animation:fadeIn 1s ease 10.7s both}
.controls{position:absolute;z-index:40;bottom:28px;right:5vw;display:flex;align-items:center;gap:18px}
.controls button{appearance:none;border:1px solid #49453e;background:rgba(10,10,10,.75);color:#d8d2c7;padding:10px 14px;font:9px var(--sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.controls button:hover{background:#e9e5dc;color:#111}
.progress{position:absolute;z-index:35;bottom:0;left:0;height:2px;width:100%;background:#24221e}
.progress i{display:block;width:0;height:100%;background:#c8c0b2;animation:progress 13s linear both}
@keyframes archRise{to{clip-path:inset(0 0 0 0)}}
@keyframes cutOpen{to{transform:translate(-50%,-50%) rotate(18deg) scaleY(1)}}
@keyframes helloIn{to{opacity:1}}
@keyframes letterUp{to{transform:translateY(0)}}
@keyframes letterDown{to{transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes ivoryReveal{to{clip-path:inset(0 0 0 0)}}
@keyframes maskText{to{clip-path:inset(0 0 0 0)}}
@keyframes maskTextRight{to{clip-path:inset(0 0 0 0)}}
@keyframes ruleGrow{to{transform:scaleX(1)}}
@keyframes blackReveal{to{clip-path:inset(0 0 0 0)}}
@keyframes cutWord{to{opacity:1;transform:translateY(0)}}
@keyframes finalReveal{to{clip-path:inset(0 0 0 0)}}
@keyframes markLetter{to{opacity:1;transform:translateY(0)}}
@keyframes sweep{to{transform:translateX(700%) skewX(-18deg)}}
@keyframes progress{to{width:100%}}
@media(max-width:600px){.topline{top:20px;font-size:8px}.arch{width:68vw;height:58vh}.scene-note{bottom:15%}.fragment-a{top:27%;left:7%}.fragment-b{top:45%;right:6%}.fragment-c{left:8%;bottom:23%;letter-spacing:.16em}.rule{left:7%;right:7%;top:40%}.final:before,.final:after{left:7vw;right:7vw}.final-caption{bottom:23%}.controls{bottom:20px;right:5vw}.controls button{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}.progress i{width:100%}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="JAYE entrance preview">
  <div class="topline"><strong>JAYE / INTRODUCTION</strong><span>CONCEPT 02 — 13 SECONDS</span></div>
  <section class="scene scene-dark">
    <div class="arch"></div><div class="lightcut"></div>
    <div class="hello"><span>H</span><span>i</span></div>
    <div class="scene-note">A PRESENCE&nbsp; / &nbsp;001</div>
  </section>
  <section class="scene scene-flash">
    <div class="fragment fragment-a">FRAGMENTS <em>OF</em></div>
    <div class="rule"></div>
    <div class="fragment fragment-b">becoming</div>
    <div class="fragment fragment-c">A collection of things that remain</div>
  </section>
  <section class="scene scene-cut"><div class="cut-word">Not everything <span>needs</span> a name.</div></section>
  <section class="scene final">
    <div class="wordmark" aria-label="JAYE"><span>J</span><span>A</span><span>Y</span><span>E</span></div>
    <div class="sweep"></div>
    <div class="final-caption">A WORLD, STILL UNFOLDING</div>
  </section>
  <div class="grain"></div>
  <div class="progress"><i></i></div>
  <div class="controls"><button id="replay" type="button">Replay sequence ↻</button></div>
</main>
<script>
const stage=document.getElementById('stage');
document.getElementById('replay').addEventListener('click',()=>{
  stage.classList.remove('replay');
  void stage.offsetWidth;
  const animations=stage.querySelectorAll('*');
  animations.forEach(el=>{el.style.animation='none';});
  void stage.offsetWidth;
  animations.forEach(el=>{el.style.animation='';});
});
</script>
</body>
</html>

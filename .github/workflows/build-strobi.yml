name: Build Strobi Widget

'on':
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install packages
        run: npm install
      - name: Run full test suite
        run: npm test
      - name: Build app, type-check and build widget
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strobi-widget
          path: dist-widget/

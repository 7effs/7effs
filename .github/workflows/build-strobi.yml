name: Build Strobi Widget

'on':
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media inspection tools
        if: github.ref == 'refs/heads/safety/test-baseline-2026-11-26'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg optipng python3-pil
      - name: Conservatively optimize the two approved assets
        if: github.ref == 'refs/heads/safety/test-baseline-2026-11-26'
        run: |
          set -euo pipefail

          echo "Demi PNG: lossless optimization with pixel equality verification"
          original_png_bytes=$(stat -c%s demi.png)
          cp demi.png "$RUNNER_TEMP/demi.png"
          optipng -o7 "$RUNNER_TEMP/demi.png"
          python3 - <<'PY'
          from PIL import Image
          with Image.open("demi.png") as original, Image.open(__import__("os").environ["RUNNER_TEMP"] + "/demi.png") as optimized:
              assert original.size == optimized.size, "PNG dimensions changed"
              assert original.mode == optimized.mode, "PNG color mode changed"
              assert original.tobytes() == optimized.tobytes(), "PNG pixel data changed"
          print("PNG verification passed: dimensions, mode, and every decoded pixel are identical")
          PY
          optimized_png_bytes=$(stat -c%s "$RUNNER_TEMP/demi.png")
          if (( optimized_png_bytes < original_png_bytes )); then
            cp "$RUNNER_TEMP/demi.png" demi.png
            echo "Demi PNG: $original_png_bytes -> $optimized_png_bytes bytes"
          else
            echo "Demi PNG: no size reduction; original retained ($original_png_bytes bytes)"
          fi

          echo "Glimpse song1: inspect first; re-encode only if source average bitrate exceeds 288 kbps"
          python3 - <<'PY'
          import json, os, shutil, subprocess
          source = "glimpse/song1.mp3"
          candidate = os.environ["RUNNER_TEMP"] + "/song1-256k.mp3"

          def probe(path):
              raw = subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries",
                  "format=duration,bit_rate:stream=codec_type,codec_name,sample_rate,channels,bit_rate",
                  "-of", "json", path
              ], text=True)
              data = json.loads(raw)
              audio = next((s for s in data.get("streams", []) if s.get("codec_type") == "audio"), None)
              if not audio:
                  raise RuntimeError("No audio stream found")
              bitrate = int(data.get("format", {}).get("bit_rate") or audio.get("bit_rate") or 0)
              duration = float(data["format"]["duration"])
              return data, audio, bitrate, duration

          original_data, original_audio, original_bitrate, original_duration = probe(source)
          original_bytes = os.path.getsize(source)
          print(f"Source: {original_bytes} bytes, {original_bitrate} bps average, "
                f"{original_duration:.3f}s, {original_audio.get('sample_rate')} Hz, "
                f"{original_audio.get('channels')} channel(s), codec={original_audio.get('codec_name')}")

          if original_audio.get("codec_name") != "mp3" or original_bitrate <= 288000:
              print("MP3 unchanged: source is not above the conservative 288 kbps threshold")
          else:
              command = [
                  "ffmpeg", "-hide_banner", "-v", "error", "-y", "-i", source,
                  "-map", "0:a:0", "-map", "0:v?", "-map_metadata", "0", "-map_chapters", "0",
                  "-c:a", "libmp3lame", "-b:a", "256k", "-c:v", "copy",
                  "-id3v2_version", "3", "-write_id3v1", "1", candidate
              ]
              subprocess.run(command, check=True)
              candidate_data, candidate_audio, candidate_bitrate, candidate_duration = probe(candidate)
              candidate_bytes = os.path.getsize(candidate)
              original_types = sorted(s.get("codec_type", "") for s in original_data.get("streams", []))
              candidate_types = sorted(s.get("codec_type", "") for s in candidate_data.get("streams", []))
              same_audio_format = (
                  candidate_audio.get("sample_rate") == original_audio.get("sample_rate")
                  and candidate_audio.get("channels") == original_audio.get("channels")
                  and candidate_audio.get("codec_name") == "mp3"
              )
              duration_ok = abs(candidate_duration - original_duration) <= 0.10
              streams_ok = original_types == candidate_types

              for path in (source, candidate):
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-v", "error", "-i", path,
                      "-map", "0:a:0", "-f", "null", "-"
                  ], check=True)

              print(f"Candidate: {candidate_bytes} bytes, {candidate_bitrate} bps average, "
                    f"{candidate_duration:.3f}s, stream types={candidate_types}")
              if (same_audio_format and duration_ok and streams_ok
                      and candidate_bytes <= original_bytes * 0.95):
                  shutil.copy2(candidate, source)
                  print(f"MP3 accepted: {original_bytes} -> {candidate_bytes} bytes; "
                        "full decode, duration, sample rate, channels, and stream checks passed")
              else:
                  print("MP3 unchanged: candidate did not meet every conservative validation threshold")
          PY

      - name: Commit optimized assets to safety branch
        if: github.ref == 'refs/heads/safety/test-baseline-2026-11-26'
        run: |
          set -euo pipefail
          git add -- demi.png glimpse/song1.mp3
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: optimize Demi PNG and Glimpse track safely"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No approved asset produced a worthwhile verified reduction"
          fi

      - name: Install packages
        run: npm install
      - name: Run full test suite
        run: npm test
      - name: Build app, type-check and build widget
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strobi-widget
          path: dist-widget/

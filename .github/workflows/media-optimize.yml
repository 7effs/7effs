name: Prepare optimized video and Glimpse audio

permissions:
  contents: write

'on':
  push:
    branches:
      - fix/video-audio-buffering-20261118
    paths:
      - ".github/workflows/media-optimize.yml"

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Inspect and optimize only target media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p optimized-media/glimpse
          for file in jaye-video-background.mp4 glimpse/song1.mp3 glimpse/song2.mp3; do
            echo "===== SOURCE: $file ====="
            ffprobe -v error -show_entries format=duration,size,bit_rate:stream=codec_name,profile,width,height,avg_frame_rate,bit_rate,sample_rate,channels -of json "$file"
          done
          for file in glimpse/song1.mp3 glimpse/song2.mp3; do
            output="optimized-media/$file"
            mkdir -p "$(dirname "$output")"
            bitrate="$(ffprobe -v error -show_entries format=bit_rate -of default=noprint_wrappers=1:nokey=1 "$file" | head -n1)"
            if [[ "$bitrate" =~ ^[0-9]+$ ]] && (( bitrate > 140000 )); then
              ffmpeg -hide_banner -y -i "$file" -map 0:a:0 -vn -sn -dn -c:a libmp3lame -b:a 128k -ar 44100 -ac 2 -map_metadata 0 -id3v2_version 3 "$output"
            else
              cp "$file" "$output"
            fi
            echo "AUDIO_SIZE $file $(stat -c%s "$file") -> $(stat -c%s "$output")"
          done
          ffmpeg -hide_banner -y -i jaye-video-background.mp4 -map 0:v:0 -an -sn -dn -vf "scale=w='min(1280,iw)':h='min(720,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" -c:v libx264 -preset slow -crf 25 -profile:v main -pix_fmt yuv420p -movflags +faststart optimized-media/jaye-video-background.mp4
          echo "VIDEO_SIZE $(stat -c%s jaye-video-background.mp4) -> $(stat -c%s optimized-media/jaye-video-background.mp4)"
          echo "===== OPTIMIZED VIDEO ====="
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=codec_name,profile,width,height,avg_frame_rate,bit_rate -of json optimized-media/jaye-video-background.mp4
      - name: Commit optimized media to this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp optimized-media/jaye-video-background.mp4 jaye-video-background.mp4
          cp optimized-media/glimpse/song1.mp3 glimpse/song1.mp3
          cp optimized-media/glimpse/song2.mp3 glimpse/song2.mp3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jaye-video-background.mp4 glimpse/song1.mp3 glimpse/song2.mp3
          if git diff --cached --quiet; then
            echo "Optimized media is already current."
          else
            git commit -m "Optimize background video and Glimpse audio"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-jaye-media
          path: optimized-media/
          if-no-files-found: error
          retention-days: 2
